<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ══ Design tokens ══ */
:root {
  --bg:            #ffffff;
  --bg-soft:       #f7f8fa;
  --bg-sunken:     #eef1f5;
  --surface:       #ffffff;
  --border:        #e3e7ed;
  --border-strong: #cbd3de;

  --text:          #16191d;
  --text-body:     #2f343b;
  --text-muted:    #626a75;
  --text-faint:    #8a929c;

  --accent:        #2f5cff;
  --accent-soft:   #eef2ff;
  --accent-line:   #b9c7ff;

  --key:           #0f7a5a;
  --key-soft:      #e9f7f1;
  --key-line:      #9fd9c5;

  --note:          #a4620a;
  --note-soft:     #fdf5e7;
  --note-line:     #ecd3a3;

  --warn:          #b3261e;
  --warn-soft:     #fdeceb;
  --warn-line:     #f3c1bd;

  --radius:        10px;
  --sidebar-w:     286px;
  --content-w:     780px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #0f1216;
    --bg-soft:       #161a20;
    --bg-sunken:     #1b2027;
    --surface:       #14181e;
    --border:        #262d36;
    --border-strong: #39424e;

    --text:          #eef1f5;
    --text-body:     #c7ced7;
    --text-muted:    #949daa;
    --text-faint:    #6f7885;

    --accent:        #7f9bff;
    --accent-soft:   #182036;
    --accent-line:   #33436e;

    --key:           #4fd1a5;
    --key-soft:      #10221d;
    --key-line:      #245346;

    --note:          #e5b567;
    --note-soft:     #241d10;
    --note-line:     #55431f;

    --warn:          #ff8a80;
    --warn-soft:     #2a1513;
    --warn-line:     #5e2b26;
  }
}

/* ══ Base ══ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }
body {
  font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  background: var(--bg); color: var(--text-body);
  line-height: 1.78; word-break: keep-all; overflow-wrap: anywhere;
}
a { color: var(--accent); }

/* ══ Reading progress ══ */
#progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: var(--accent); z-index: 100; transition: width .1s linear;
}

/* ══ Layout ══ */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  gap: 48px;
  max-width: calc(var(--sidebar-w) + var(--content-w) + 48px + 80px);
  margin: 0 auto;
  padding: 0 40px;
}
.main { max-width: var(--content-w); padding: 40px 0 80px; min-width: 0; }

/* ══ Sidebar ══ */
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh; overflow-y: auto;
  padding: 40px 0 40px;
  border-right: 1px solid var(--border);
  margin-right: -24px; padding-right: 24px;
  scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.side-brand {
  font-size: .6875rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
}
.side-title {
  font-size: .9375rem; font-weight: 700; line-height: 1.5; color: var(--text);
  margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.side-heading {
  font-size: .6875rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 10px;
}
.toc-list { list-style: none; }
.toc-list a {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px;
  padding: 7px 10px 7px 8px; margin-left: -8px;
  font-size: .8125rem; line-height: 1.5; color: var(--text-muted);
  text-decoration: none; border-radius: 7px; border-left: 2px solid transparent;
  transition: background .15s, color .15s;
}
.toc-list a:hover { background: var(--bg-soft); color: var(--text); }
.toc-list a.active {
  background: var(--accent-soft); color: var(--accent);
  font-weight: 600; border-left-color: var(--accent);
}
.toc-list .toc-num {
  font-size: .6875rem; font-weight: 700; color: var(--text-faint);
  font-variant-numeric: tabular-nums; padding-top: 2px;
}
.toc-list a.active .toc-num { color: var(--accent); }
.toc-list li.lv3 { padding-left: 14px; }
.toc-list li.lv3 a { grid-template-columns: minmax(0, 1fr); font-size: .78125rem; }

/* ══ Article header ══ */
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .75rem; font-weight: 700; letter-spacing: .04em;
  color: var(--accent); background: var(--accent-soft);
  padding: 5px 11px; border-radius: 999px; margin-bottom: 18px;
}
.article-title {
  font-size: 2.125rem; font-weight: 800; line-height: 1.32; letter-spacing: -.022em;
  color: var(--text); margin-bottom: 20px;
}
.meta-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding-bottom: 26px; border-bottom: 1px solid var(--border); margin-bottom: 28px;
}
.meta-chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-size: .8125rem; color: var(--text-body);
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 999px;
}
.meta-chip b { font-weight: 600; color: var(--text-faint); font-size: .75rem; }

/* ══ Report body ══ */
.report-body { counter-reset: sec; }
.report-body h2 {
  display: flex; align-items: flex-start; gap: 14px;
  font-size: 1.5rem; font-weight: 700; line-height: 1.4; letter-spacing: -.018em;
  color: var(--text); margin: 46px 0 18px; scroll-margin-top: 24px;
}
.report-body h2::before {
  content: counter(sec, decimal-leading-zero); counter-increment: sec;
  flex: none; display: inline-grid; place-items: center;
  width: 32px; height: 32px; margin-top: 3px;
  font-size: .8125rem; font-weight: 700; font-variant-numeric: tabular-nums;
  color: #fff; background: var(--accent); border-radius: 9px;
}
.report-body h2:first-child { margin-top: 8px; }
.report-body h3 {
  font-size: 1.125rem; font-weight: 700; color: var(--text);
  margin: 32px 0 12px; scroll-margin-top: 24px;
}
.report-body h4 {
  font-size: 1rem; font-weight: 700; color: var(--text);
  margin: 24px 0 10px; scroll-margin-top: 24px;
}
.report-body p { font-size: 1.0625rem; line-height: 1.85; margin-bottom: 16px; }
.report-body ul, .report-body ol { margin: 0 0 18px 4px; padding-left: 22px; }
.report-body li { font-size: 1.0625rem; line-height: 1.82; margin-bottom: 13px; }
.report-body li > ul, .report-body li > ol { margin-top: 10px; }
.report-body strong { color: var(--text); font-weight: 700; }
.report-body hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }
code {
  font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  font-size: .875em; background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 6px; color: var(--text);
}
pre {
  background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; overflow-x: auto;
  margin-bottom: 18px; font-size: .875rem; line-height: 1.7;
}
pre code { background: none; border: none; padding: 0; }

/* 인용/노트 박스: blockquote */
.report-body blockquote {
  background: var(--note-soft); border: 1px solid var(--note-line);
  border-left: 4px solid var(--note);
  border-radius: var(--radius); padding: 14px 20px; margin: 0 0 20px;
}
.report-body blockquote p { font-size: 1rem; line-height: 1.78; margin-bottom: 8px; }
.report-body blockquote p:last-child { margin-bottom: 0; }

/* 경고 박스: blockquote 첫 블록이 ⚠️ 로 시작할 때 */
.report-body blockquote.warn {
  background: var(--warn-soft); border-color: var(--warn-line);
  border-left-color: var(--warn);
}

/* ══ Footnotes (출처 각주) ══ */
.report-body sup {
  font-size: .72em; line-height: 0;
}
.report-body sup a {
  color: var(--accent); text-decoration: none; font-weight: 600;
  padding: 0 1px;
}
.report-body sup a:hover { text-decoration: underline; }
.report-body .footnote {
  margin-top: 44px; padding-top: 4px;
  font-size: .875rem; color: var(--text-muted);
}
.report-body .footnote hr { display: none; }
.report-body .footnote ol { padding-left: 22px; margin: 8px 0 0; }
.report-body .footnote li {
  font-size: .875rem; line-height: 1.7; margin-bottom: 6px; color: var(--text-muted);
}
.report-body .footnote li a { word-break: break-all; }

/* ══ Figures (영상 프레임) ══ */
.report-body img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--border); border-radius: var(--radius);
  margin: 10px 0 6px;
}
.report-body img + em {
  display: block; font-size: .8125rem; color: var(--text-faint);
  text-align: center; line-height: 1.6; margin: 0 0 22px;
}

/* ══ Tables ══ */
.table-wrap { overflow-x: auto; margin: 0 0 22px; }
.table-wrap table {
  width: 100%; border-collapse: collapse;
  font-size: .9375rem; line-height: 1.65;
}
.table-wrap th {
  text-align: left; font-weight: 700; color: var(--text);
  background: var(--bg-soft); border-bottom: 2px solid var(--border-strong);
  padding: 9px 12px; white-space: nowrap;
}
.table-wrap td {
  border-bottom: 1px solid var(--border); padding: 9px 12px;
  vertical-align: top; min-width: 72px;
}
.table-wrap tr:last-child td { border-bottom: 2px solid var(--border-strong); }

/* ══ Footer ══ */
.article-footer {
  margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center;
  font-size: .8125rem; color: var(--text-faint);
}
.source-links { display: flex; flex-wrap: wrap; gap: 8px; }
.source-link {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .8125rem; font-weight: 600; color: var(--accent); text-decoration: none;
  border: 1px solid var(--accent-line); padding: 6px 12px; border-radius: 8px;
}
.source-link:hover { background: var(--accent-soft); }

/* ══ Top button ══ */
#totop {
  position: fixed; right: 26px; bottom: 26px; z-index: 90;
  width: 42px; height: 42px; display: grid; place-items: center;
  background: var(--surface); color: var(--text-muted);
  border: 1px solid var(--border-strong); border-radius: 50%;
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s;
  box-shadow: 0 2px 10px rgba(0,0,0,.09);
}
#totop.show { opacity: 1; pointer-events: auto; }
#totop:hover { color: var(--accent); border-color: var(--accent); }

/* ══ Responsive ══ */
@media (max-width: 1080px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 28px; max-width: 820px; }
  .sidebar {
    position: static; height: auto; border-right: none; margin-right: 0; padding: 28px 0 0;
  }
  .side-title { display: none; }
  .sidebar-inner {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .side-brand { display: none; }
  .main { padding-top: 28px; }
}
@media (max-width: 640px) {
  .layout { padding: 0 18px; }
  .article-title { font-size: 1.5rem; }
  .report-body h2 { font-size: 1.1875rem; gap: 10px; }
  .report-body h2::before { width: 27px; height: 27px; font-size: .75rem; border-radius: 8px; }
  .report-body p, .report-body li { font-size: 1rem; }
  #totop { right: 14px; bottom: 14px; }
}
@media print {
  .sidebar, #progress, #totop { display: none; }
  .layout { display: block; padding: 0; }
  .report-body h2, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>

<div id="progress"></div>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="side-brand">Research Report</div>
      <div class="side-title">{{TITLE}}</div>
      <div class="side-heading">목차</div>
      <ul class="toc-list">
        {{TOC}}
      </ul>
    </div>
  </aside>

  <main class="main">

    <span class="eyebrow">종합 리서치 리포트</span>

    <h1 class="article-title">{{TITLE}}</h1>

    <div class="meta-bar">
      {{META_CHIPS}}
    </div>

    <div class="report-body">
      {{CONTENT}}
    </div>

    <div class="article-footer">
      <span>생성일: {{TIMESTAMP}}</span>
      <div class="source-links">
        {{SOURCE_LINKS}}
      </div>
    </div>

  </main>
</div>

<button id="totop" aria-label="맨 위로">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function () {
  var bar = document.getElementById('progress');
  var totop = document.getElementById('totop');
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc-list a'));
  var sections = links.map(function (a) {
    return document.getElementById(a.getAttribute('href').slice(1));
  });

  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    totop.classList.toggle('show', h.scrollTop > 600);

    var idx = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i] && sections[i].getBoundingClientRect().top <= 120) idx = i;
    }
    links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      window.requestAnimationFrame(function () { onScroll(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });

  totop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  onScroll();
})();
</script>

</body>
</html>
