<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ══════════ Design tokens ══════════ */
:root {
  --bg:#ffffff; --bg-soft:#f7f8fa; --bg-sunken:#eef1f5; --surface:#ffffff;
  --border:#e3e7ed; --border-strong:#cbd3de;
  --text:#16191d; --text-body:#2f343b; --text-muted:#626a75; --text-faint:#8a929c;
  --accent:#2f5cff; --accent-soft:#eef2ff; --accent-line:#b9c7ff;
  --key:#0f7a5a; --key-soft:#e9f7f1; --key-line:#9fd9c5;
  --note:#a4620a; --note-soft:#fdf5e7; --note-line:#ecd3a3;
  --radius:12px;
  --topbar-h:46px;
  --stage-pt:18px;
  --stage-pb:80px;

  /* SVG 다이어그램 토큰 (인라인 SVG가 상속) */
  --dg-ink:#16191d; --dg-ink-soft:#626a75; --dg-bg:#ffffff; --dg-surface:#f7f8fa;
  --dg-line:#cbd3de; --dg-accent:#2f5cff; --dg-accent-soft:#eef2ff;
  --dg-key:#0f7a5a; --dg-key-soft:#e9f7f1; --dg-warn:#a4620a; --dg-warn-soft:#fdf5e7;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f1216; --bg-soft:#161a20; --bg-sunken:#1b2027; --surface:#14181e;
  --border:#262d36; --border-strong:#39424e;
  --text:#eef1f5; --text-body:#c7ced7; --text-muted:#949daa; --text-faint:#6f7885;
  --accent:#7f9bff; --accent-soft:#182036; --accent-line:#33436e;
  --key:#4fd1a5; --key-soft:#10221d; --key-line:#245346;
  --note:#e0aa5a; --note-soft:#241c10; --note-line:#4d3a1d;
  --dg-ink:#e6eaf0; --dg-ink-soft:#98a2b0; --dg-bg:#14181e; --dg-surface:#1b2027;
  --dg-line:#3b4553; --dg-accent:#7f9bff; --dg-accent-soft:#1b2440;
  --dg-key:#4fd1a5; --dg-key-soft:#12241f; --dg-warn:#e0aa5a; --dg-warn-soft:#261d10;
} }
:root[data-theme="dark"] {
  --bg:#0f1216; --bg-soft:#161a20; --bg-sunken:#1b2027; --surface:#14181e;
  --border:#262d36; --border-strong:#39424e;
  --text:#eef1f5; --text-body:#c7ced7; --text-muted:#949daa; --text-faint:#6f7885;
  --accent:#7f9bff; --accent-soft:#182036; --accent-line:#33436e;
  --key:#4fd1a5; --key-soft:#10221d; --key-line:#245346;
  --note:#e0aa5a; --note-soft:#241c10; --note-line:#4d3a1d;
  --dg-ink:#e6eaf0; --dg-ink-soft:#98a2b0; --dg-bg:#14181e; --dg-surface:#1b2027;
  --dg-line:#3b4553; --dg-accent:#7f9bff; --dg-accent-soft:#1b2440;
  --dg-key:#4fd1a5; --dg-key-soft:#12241f; --dg-warn:#e0aa5a; --dg-warn-soft:#261d10;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-sunken); color:var(--text-body);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}

/* ══════════ Top bar ══════════ */
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar h1{
  font-size:14px; font-weight:650; color:var(--text); margin:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw;
}
.spacer{flex:1}
.counter{font-size:12.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.btn{
  border:1px solid var(--border-strong); background:var(--bg-soft); color:var(--text-body);
  border-radius:8px; padding:5px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  font-family:inherit;
}
.btn:hover{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
.progress{position:absolute; left:0; bottom:-1px; height:2px; background:var(--accent); transition:width .18s ease}

/* ══════════ Stage ══════════ */
.stage{max-width:1900px; margin:0 auto; padding:var(--stage-pt) clamp(12px,1.2vw,24px) var(--stage-pb)}
.slide{display:none}
.slide.active{display:block}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:clamp(26px,2.4vw,46px) clamp(30px,3vw,60px); min-height:52vh;
  display:flex; flex-direction:column;
}
.eyebrow{
  display:flex; align-items:center; gap:10px; margin-bottom:clamp(10px,1.2vh,18px);
  font-size:clamp(11.5px,.82vw,15px); letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint);
}
.kind{
  display:inline-block; padding:2px 9px; border-radius:99px; font-size:clamp(11px,.78vw,14px);
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  text-transform:none; letter-spacing:0;
}
.slide h2{
  margin:0 0 clamp(8px,1vh,16px); font-size:clamp(28px,2.5vw,46px); line-height:1.3;
  color:var(--text); font-weight:700; letter-spacing:-.015em;
}
.lead{
  margin:0 0 clamp(18px,2.2vh,32px); font-size:clamp(17px,1.32vw,26px); color:var(--text-body);
  font-weight:500; line-height:1.55; padding-left:clamp(13px,.9vw,18px); border-left:4px solid var(--accent);
}
.body{display:grid; grid-template-columns:1fr; gap:clamp(24px,2.4vw,44px); flex:1; min-height:0}
.body.has-visual{grid-template-columns:minmax(0,1fr) minmax(0,1.42fr); align-items:start}
@media (max-width:980px){ .body.has-visual{grid-template-columns:1fr} }
ul.bullets{margin:0; padding-left:clamp(20px,1.4vw,28px)}
ul.bullets li{
  margin:0 0 clamp(11px,1.35vh,20px); font-size:clamp(16px,1.16vw,23px);
  line-height:1.55; color:var(--text-body);
}
ul.bullets li::marker{color:var(--accent)}

.visual{margin:0; min-width:0; display:flex; flex-direction:column}
.visual .frame{
  border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--bg-soft);
  display:flex; align-items:center; justify-content:center; padding:clamp(8px,.7vw,16px);
  min-height:0;
}
.visual .frame svg{width:100%; height:auto; max-height:100%; display:block}
.visual .frame img{width:100%; height:auto; max-height:100%; object-fit:contain; display:block; border-radius:6px}
.visual figcaption{
  margin-top:10px; font-size:clamp(12.5px,.88vw,16px); color:var(--text-muted); line-height:1.6; flex:none;
}

/* ── 발표 모드 (해설 닫힘): 슬라이드가 화면을 꽉 채운다 ── */
/* min-height만 주면 SVG가 height:100%를 요구할 때 카드가 뷰포트를 넘어 자란다 → 높이를 고정한다 */
body.notes-off .card{
  height:calc(100vh - var(--topbar-h) - var(--stage-pt) - var(--stage-pb));
  min-height:0; overflow:hidden;
}
body.notes-off .body{grid-template-rows:minmax(0,1fr)}
/* 그림에 폭을 몰아준다 — 대부분의 도해가 가로로 길어, 폭이 곧 시인성이다 */
body.notes-off .body.has-visual{grid-template-columns:minmax(0,.78fr) minmax(0,2.3fr); align-items:center}
body.notes-off .body.has-visual > div{align-self:start}
/* 그림 없는 슬라이드는 본문을 세로 가운데로 — 위로 몰리면 아래가 통째로 빈다 */
body.notes-off .body:not(.has-visual){grid-template-rows:auto; align-content:center}

/* 가로로 긴 도해는 좌우 2단이 전폭 배치보다 실제로 더 크게 들어간다(높이가 병목이라서).
   전폭 스택은 쓰지 않고, 그림 열의 비중만 키운다. */
/* 높이 사슬을 '확정 높이'로 이어야 이미지가 잘리지 않고 비율대로 줄어든다.
   행을 stretch → .visual 100% → .frame flex:1 → 자산 height:100% + contain */
body.notes-off .body.has-visual{align-items:stretch}
body.notes-off .visual{height:100%; min-height:0; justify-content:center}
body.notes-off .visual .frame{flex:1 1 auto; min-height:0}
body.notes-off .visual .frame svg{width:100%; height:100%; max-height:none}
body.notes-off .visual .frame img{width:100%; height:100%; object-fit:contain; max-height:none}
body.notes-off .body:not(.has-visual) ul.bullets li{font-size:clamp(19px,1.6vw,32px)}
body.notes-off .body:not(.has-visual){max-width:1180px}
/* 표지의 원본 영상 링크 */
.source-link{margin:clamp(20px,2.6vh,36px) 0 0}
.source-link a{
  display:inline-block; padding:clamp(8px,.8vw,13px) clamp(14px,1.3vw,22px);
  border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent);
  border-radius:10px; text-decoration:none; font-weight:650; font-size:clamp(15px,1.1vw,21px);
}
.source-link a:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.source-link .url{
  display:inline-block; margin-top:9px; font-size:clamp(12.5px,.9vw,16px);
  color:var(--text-faint); word-break:break-all;
}
.novisual{
  border:1px dashed var(--border-strong); border-radius:10px; padding:16px;
  font-size:13px; color:var(--text-faint); background:var(--bg-soft);
}

/* ══════════ Notes ══════════ */
.notes{
  margin-top:16px; background:var(--bg-soft); border:1px solid var(--border);
  border-left:3px solid var(--note); border-radius:var(--radius); padding:22px 26px;
}
body.notes-off .notes{display:none}
.notes h3{
  margin:0 0 14px; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--note); font-weight:700;
}
.notes .why{
  margin:0 0 14px; padding:11px 14px; background:var(--note-soft);
  border:1px solid var(--note-line); border-radius:8px; font-size:14.5px; color:var(--text-body);
}
.notes p{margin:0 0 14px; font-size:clamp(15px,1.02vw,19px); line-height:1.75; color:var(--text-body)}
.notes .analogy{
  margin:0 0 13px; padding:11px 14px; background:var(--key-soft); border:1px solid var(--key-line);
  border-radius:8px; font-size:14.5px; color:var(--text-body);
}
.notes .analogy::before{content:"비유  "; color:var(--key); font-weight:700; font-size:12px}
.notes .caveat{
  margin:0 0 13px; padding:11px 14px; background:var(--bg-sunken); border:1px dashed var(--border-strong);
  border-radius:8px; font-size:14px; color:var(--text-muted);
}
.notes .caveat::before{content:"유의  "; font-weight:700; font-size:12px}
.meta-row{
  display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; padding-top:14px;
  border-top:1px dashed var(--border); align-items:center;
}
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px;
  font-size:12px; text-decoration:none; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text-muted);
}
.chip:hover{border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft)}
.chip.t{border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft)}
.chip.term{border-color:var(--key-line); color:var(--key); background:var(--key-soft)}
blockquote.quote{
  margin:0 0 13px; padding:10px 14px; border-left:2px solid var(--border-strong);
  color:var(--text-muted); font-size:13.5px; font-style:italic; background:var(--bg-sunken);
  border-radius:0 8px 8px 0;
}

/* ══════════ Tables (results) ══════════ */
.notes table, .card table{
  width:100%; border-collapse:collapse; margin:6px 0 14px; font-size:14px;
}
.card th,.card td,.notes th,.notes td{
  border:1px solid var(--border); padding:7px 10px; text-align:left;
}
.card th,.notes th{background:var(--bg-sunken); color:var(--text); font-weight:650}

/* ══════════ Overview ══════════ */
.overview{
  display:none; position:fixed; inset:0; z-index:100; background:var(--bg);
  overflow:auto; padding:22px;
}
.overview.open{display:block}
.ov-head{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.ov-head h2{margin:0; font-size:17px; color:var(--text)}
.ov-sec{margin:0 0 8px; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint)}
.ov-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:11px; margin-bottom:24px}
.ov-item{
  text-align:left; border:1px solid var(--border); border-radius:9px; background:var(--surface);
  padding:11px 13px; cursor:pointer; font-family:inherit; color:var(--text-body);
}
.ov-item:hover{border-color:var(--accent-line); background:var(--accent-soft)}
.ov-item .n{font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums}
.ov-item .t{display:block; margin-top:3px; font-size:13.5px; font-weight:600; color:var(--text); line-height:1.45}

/* ══════════ Footer nav ══════════ */
.navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; justify-content:center;
  gap:8px; padding:10px; background:linear-gradient(to top, var(--bg-sunken) 62%, transparent);
}
.navbar .btn{padding:7px 16px}

/* ══════════ Print ══════════ */
@media print{
  body{background:#fff}
  .topbar,.navbar,.overview{display:none !important}
  .stage{max-width:none; padding:0}
  .slide{display:block !important; page-break-after:always; break-after:page; margin-bottom:0}
  .card{border:none; min-height:auto !important; padding:14mm 0 4mm; display:block}
  .visual .frame svg{height:auto !important; width:100% !important}
  .notes{display:block !important; background:#fff; border:none; border-left:2px solid #bbb}
  .btn,.chip{border-color:#ccc}
}
</style>
</head>
<body class="">

<header class="topbar">
  <h1>{{TITLE}}</h1>
  <span class="spacer"></span>
  <span class="counter"><span id="cur">1</span> / {{SLIDE_COUNT}}</span>
  <button class="btn" id="btn-notes" aria-pressed="true" title="해설 노트 토글 (N)">해설</button>
  <button class="btn" id="btn-ov" title="전체 슬라이드 (O)">목차</button>
  <button class="btn" id="btn-theme" title="테마 전환">테마</button>
  <button class="btn" onclick="window.print()" title="인쇄/PDF">인쇄</button>
  <div class="progress" id="progress" style="width:0%"></div>
</header>

<main class="stage" id="stage">
{{SLIDES}}
</main>

<nav class="navbar">
  <button class="btn" id="btn-prev">← 이전</button>
  <button class="btn" id="btn-next">다음 →</button>
</nav>

<div class="overview" id="overview">
  <div class="ov-head">
    <h2>전체 슬라이드</h2>
    <span class="spacer"></span>
    <button class="btn" id="btn-ov-close">닫기 (Esc)</button>
  </div>
{{OVERVIEW}}
</div>

<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  var curEl = document.getElementById('cur');
  var progEl = document.getElementById('progress');

  // 자산 지연 주입 — 59장의 SVG·이미지를 모두 DOM에 두면 Chrome이 래스터 예산을
  // 아끼려고 SVG를 저해상도로 그린다(도해 텍스트가 뭉개짐). 보이는 슬라이드만 채운다.
  function hydrate(sl){
    sl.querySelectorAll('img[data-src]').forEach(function(im){
      if(!im.getAttribute('src')) im.setAttribute('src', im.dataset.src);
    });
    sl.querySelectorAll('.frame[data-svg-id]').forEach(function(box){
      if(box.firstChild) return;
      var src = document.getElementById(box.dataset.svgId);
      if(src) box.innerHTML = src.textContent;
    });
  }
  function dehydrate(sl){
    sl.querySelectorAll('img[data-src]').forEach(function(im){ im.removeAttribute('src'); });
    sl.querySelectorAll('.frame[data-svg-id]').forEach(function(box){ box.innerHTML = ''; });
  }

  function show(i, push){
    if(i < 0) i = 0;
    if(i > slides.length - 1) i = slides.length - 1;
    slides[cur].classList.remove('active');
    if(i !== cur) dehydrate(slides[cur]);
    cur = i;
    hydrate(slides[cur]);
    slides[cur].classList.add('active');
    curEl.textContent = (cur + 1);
    progEl.style.width = ((cur + 1) / slides.length * 100) + '%';
    window.scrollTo(0, 0);
    if(push !== false) history.replaceState(null, '', '#' + slides[cur].id);
  }
  function jumpFromHash(){
    var id = (location.hash || '').slice(1);
    if(!id) return;
    for(var i = 0; i < slides.length; i++){ if(slides[i].id === id){ show(i, false); return; } }
  }

  document.getElementById('btn-prev').onclick = function(){ show(cur - 1); };
  document.getElementById('btn-next').onclick = function(){ show(cur + 1); };

  var ov = document.getElementById('overview');
  document.getElementById('btn-ov').onclick = function(){ ov.classList.toggle('open'); };
  document.getElementById('btn-ov-close').onclick = function(){ ov.classList.remove('open'); };
  ov.addEventListener('click', function(e){
    var t = e.target.closest('.ov-item');
    if(!t) return;
    show(parseInt(t.dataset.i, 10));
    ov.classList.remove('open');
  });

  var btnNotes = document.getElementById('btn-notes');
  function setNotes(off){
    document.body.classList.toggle('notes-off', off);
    btnNotes.setAttribute('aria-pressed', off ? 'false' : 'true');
    try { localStorage.setItem('deck-notes', off ? 'off' : 'on'); } catch(e){}
  }
  btnNotes.onclick = function(){ setNotes(!document.body.classList.contains('notes-off')); };
  // 초기 상태: ?notes=off URL 파라미터 > 이전 선택 기억 > 기본 켜짐
  (function(){
    var q = /[?&]notes=(on|off)/.exec(location.search);
    var pref = q ? q[1] : null;
    if(!pref){ try { pref = localStorage.getItem('deck-notes'); } catch(e){} }
    if(pref === 'off') setNotes(true);
  })();

  var btnTheme = document.getElementById('btn-theme');
  btnTheme.onclick = function(){
    var r = document.documentElement;
    var order = ['auto', 'light', 'dark'];
    var next = order[(order.indexOf(r.getAttribute('data-theme') || 'auto') + 1) % 3];
    r.setAttribute('data-theme', next);
    btnTheme.textContent = next === 'auto' ? '테마' : (next === 'light' ? '밝게' : '어둡게');
  };

  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); show(cur + 1); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); show(cur - 1); }
    else if(e.key === 'Home'){ show(0); }
    else if(e.key === 'End'){ show(slides.length - 1); }
    else if(e.key === 'n' || e.key === 'N'){ btnNotes.click(); }
    else if(e.key === 'o' || e.key === 'O'){ ov.classList.toggle('open'); }
    else if(e.key === 'Escape'){ ov.classList.remove('open'); }
  });

  // 인쇄/PDF에는 전체가 필요하다 — 인쇄 직전에만 모두 채우고 끝나면 되돌린다
  window.addEventListener('beforeprint', function(){ slides.forEach(hydrate); });
  window.addEventListener('afterprint', function(){
    slides.forEach(function(sl, i){ if(i !== cur) dehydrate(sl); });
  });

  // 상단바 실제 높이를 재서 반영한다 — 폰트·확대 배율에 따라 달라지므로 상수로 두면 페이지가 스크롤된다
  var topbar = document.querySelector('.topbar');
  function syncTopbar(){
    document.documentElement.style.setProperty('--topbar-h', Math.ceil(topbar.getBoundingClientRect().height) + 'px');
  }
  syncTopbar();
  window.addEventListener('resize', syncTopbar);

  window.addEventListener('hashchange', jumpFromHash);
  show(0, false);
  jumpFromHash();
  // 브라우저의 앵커 자동 스크롤이 우리 스크롤 뒤에 일어나 상단바가 슬라이드 머리를 가린다
  requestAnimationFrame(function(){ window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
