<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
{{BASE_CSS}}

/* ══ 요약 페이지 전용 배치 — 값은 base.css 토큰만 쓴다 ══ */
.article { max-width: var(--read); }
.intro .srcs { margin-top: var(--s-2); }

.chapter { padding: var(--s-12) 0; border-top: 1px solid var(--line); scroll-margin-top: var(--top); }
.chapter:first-of-type { border-top: 0; padding-top: var(--s-2); }
.ch-head { margin-bottom: var(--s-6); }
.kicker { margin: 0 0 10px; font-size: var(--fs-xs); font-weight: var(--fw-bold); letter-spacing: .1em; color: var(--accent); font-variant-numeric: tabular-nums; }
.ch-head h2 { margin: 0 0 var(--s-3); font-size: var(--fs-xl); line-height: 1.3; letter-spacing: -.02em; font-weight: var(--fw-heavy); color: var(--ink); }

.prose p { margin: 0 0 var(--s-4); }
.chapter .points li { font-size: var(--fs-base); }

@media (max-width: 900px) {
  .chapter { padding: var(--s-8) 0; }
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="side-top">
    <p class="side-kicker">SUMMARY NOTES</p>
    <p class="side-title">{{TITLE}}</p>
    <div class="meter"><i id="meter"></i></div>
    <div class="meter-label"><span>읽은 위치</span><span id="meter-text">0%</span></div>
  </div>
  <ol class="nav" id="nav">
    {{TOC}}
  </ol>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar" id="topbar">
    <button type="button" class="tb-icon menu-btn" id="menu" aria-label="목차 열기"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="crumb" id="crumb"><b>{{TITLE}}</b></div>
    <button type="button" class="tb-icon" id="theme" aria-label="밝기 전환"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div class="wrap">
    <div class="article">
      <header class="intro">
        <span class="eyebrow">{{LEVEL_LABEL}} · 챕터 {{CHAPTER_COUNT}}개</span>
        <h1>{{TITLE}}</h1>
        <div class="srcs">
          <a class="src" href="{{URL}}" target="_blank" rel="noopener"><b>YouTube</b>{{CHANNEL}}<span>{{DURATION}}</span></a>
        </div>
      </header>

      {{CHAPTERS}}

      <footer class="site-foot">
        <span>{{TIMESTAMP}} 생성 · <a href="{{TOOL_URL}}" target="_blank" rel="noopener">youtube-visual-summary</a>로 만듦</span>
        <a class="btn" href="{{URL}}" target="_blank" rel="noopener">원본 영상 보기</a>
      </footer>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var root = document.documentElement;

  /* 밝기: 처음엔 컴퓨터 설정, 버튼으로 바꾸면 모든 요약 페이지가 같은 선택을 기억한다 */
  var THEME_KEY = 'yvs:theme';
  try { var saved = localStorage.getItem(THEME_KEY); if (saved) root.dataset.theme = saved; } catch (e) {}
  $('#theme').addEventListener('click', function () {
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch (e) {}
  });

  /* 좁은 화면 목차 */
  var body = document.body;
  $('#menu').addEventListener('click', function () { body.classList.add('nav-open'); });
  $('#scrim').addEventListener('click', function () { body.classList.remove('nav-open'); });

  /* 읽은 위치 + 지금 보는 챕터 */
  var links = Array.prototype.slice.call(document.querySelectorAll('#nav a'));
  var sections = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  links.forEach(function (a) { a.addEventListener('click', function () { body.classList.remove('nav-open'); }); });
  var meter = $('#meter'), meterText = $('#meter-text'), topbar = $('#topbar');
  function onScroll() {
    var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? Math.round(h.scrollTop / max * 100) : 0;
    meter.style.width = pct + '%'; meterText.textContent = pct + '%';
    topbar.classList.toggle('scrolled', h.scrollTop > 8);
    var idx = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i] && sections[i].getBoundingClientRect().top <= 140) idx = i;
    }
    links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) { requestAnimationFrame(function () { onScroll(); ticking = false; }); ticking = true; }
  }, { passive: true });
  onScroll();

  /* 프롬프트 복사 */
  var toast = $('#toast'), toastTimer;
  document.querySelectorAll('.prompt .copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = btn.closest('.prompt').querySelector('.prompt-text').innerText;
      navigator.clipboard.writeText(text).then(function () {
        toast.textContent = '복사했습니다'; toast.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
      });
    });
  });
})();
</script>
</body>
</html>
